services:
  vault:
    image: hashicorp/vault:1.15
    privileged: true
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dev-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_DISABLE_MLOCK: "true"
    command: server -dev

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
      - /mnt/k/estudohub_storage:/storage_k
      - ./storage:/app/storage
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://estudohub_admin:estudohub_pass@db:5432/estudohub
      - OLLAMA_HOST=http://ollama:11434
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=dev-root-token
    depends_on:
      - db
      - ollama
      - vault

  db:
    image: pgvector/pgvector:pg16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=estudohub_admin
      - POSTGRES_PASSWORD=estudohub_pass
      - POSTGRES_DB=estudohub
    ports:
      - "5432:5432"

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_Z3Jvd24tbGl6YXJkLTMuY2xlcmsuYWNjb3VudHMuZGV2JA
      - CLERK_SECRET_KEY=sk_test_HteRNduUHSeq3SKOBh4BSWjAnvNitXVF36xUbVWsZH
      - WATCHPACK_POLLING=true

  moenda:
    build: ./backend
    command: python mass_ingestion_industrial.py
    volumes:
      - ./backend:/app
      - /mnt/k/estudohub_storage:/storage_k
      - ./storage:/app/storage
    environment:
      - DATABASE_URL=postgresql://estudohub_admin:estudohub_pass@db:5432/estudohub
      - OLLAMA_HOST=http://ollama:11434
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=dev-root-token
    depends_on:
      - db
      - ollama
      - vault
    restart: unless-stopped

  pescador:
    build:
      context: ./backend/scripts
      dockerfile: Dockerfile.pescador
    volumes:
      - /mnt/k/estudohub_storage:/storage_k
      - ./storage:/app/storage
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
