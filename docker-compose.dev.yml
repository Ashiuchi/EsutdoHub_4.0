services:
  vault:
    image: hashicorp/vault:1.15
    privileged: true
    ports:
      - "8205:8200"
    volumes:
      - ./vault/data:/vault/file
    environment:
      - 'VAULT_LOCAL_CONFIG={"storage": {"file": {"path": "/vault/file"}}, "listener": {"tcp": {"address": "0.0.0.0:8200", "tls_disable": 1}}}'
    command: server

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
      - ./storage_k:/storage_k
      - ./storage:/app/storage
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://estudohub_admin:estudohub_pass@db:5432/estudohub
      - OLLAMA_HOST=http://ollama:11434
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_JWT_ISSUER=${CLERK_JWT_ISSUER}
      - CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - WATCHPACK_POLLING=true
    depends_on:
      - db
      - ollama
      - vault

  db:
    image: pgvector/pgvector:pg16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=estudohub_admin
      - POSTGRES_PASSWORD=estudohub_pass
      - POSTGRES_DB=estudohub

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true

  moenda:
    build: ./backend
    command: python mass_ingestion_industrial.py
    volumes:
      - ./backend:/app
      - ./storage_k:/storage_k
      - ./storage:/app/storage
    environment:
      - DATABASE_URL=postgresql://estudohub_admin:estudohub_pass@db:5432/estudohub
      - OLLAMA_HOST=http://ollama:11434
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
    depends_on:
      - db
      - ollama
      - vault
    restart: unless-stopped

  pescador:
    build:
      context: ./backend/scripts
      dockerfile: Dockerfile.pescador
    volumes:
      - ./storage_k:/storage_k
      - ./storage:/app/storage
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
